<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Upwork Assistant — Settings</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 16px; max-width: 420px; }
    label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
    #status { margin-top: 8px; font-size: 12px; color: #1e7a34; min-height: 1.2em; }
  </style>
</head>
<body>
  <h2>Upwork Assistant Capture — Settings</h2>
  <label for="apiBaseUrl">Dashboard API URL (e.g. https://yourapp.up.railway.app)</label>
  <input type="text" id="apiBaseUrl" placeholder="https://yourapp.up.railway.app">
  <label for="apiToken">API Token</label>
  <input type="password" id="apiToken" placeholder="paste your EXTENSION_API_TOKEN">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
