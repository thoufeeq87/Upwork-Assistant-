<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Upwork Assistant{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    function getCookie(name) {
      const match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
      return match ? decodeURIComponent(match[1]) : null;
    }
    document.addEventListener('htmx:configRequest', (event) => {
      event.detail.headers['X-CSRFToken'] = getCookie('csrftoken');
    });
  </script>
  <style>
    :root {
      --ink: #f3f4f7;
      --ink-soft: #9497a8;
      --ink-faint: #6b6e80;
      --paper: #14151f;
      --paper-2: #1a1c28;
      --bg: #0a0a12;
      --line: rgba(255,255,255,0.09);
      --line-soft: rgba(255,255,255,0.05);
      --pink: #ec5c9d;
      --pink-soft: rgba(236,92,157,0.14);
      --green: #34d399;
      --green-soft: rgba(52,211,153,0.14);
      --amber: #fbbf5f;
      --amber-soft: rgba(251,191,95,0.14);
      --accent: var(--pink);
      --accent-ring: rgba(236,92,157,0.22);
      --success-bg: var(--green-soft); --success-fg: var(--green);
      --warn-bg: var(--amber-soft); --warn-fg: var(--amber);
      --neutral-bg: rgba(255,255,255,0.06); --neutral-fg: var(--ink-soft);
      --danger: #f87171; --danger-bg: rgba(248,113,113,0.14);
      --favorite: var(--pink); --favorite-bg: var(--pink-soft); --favorite-line: rgba(236,92,157,0.35);
      --radius-lg: 18px;
      --radius-md: 13px;
      --radius-sm: 10px;
      --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 30px -18px rgba(0,0,0,0.6);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background:
        radial-gradient(900px 460px at 8% -8%, rgba(236,92,157,0.10) 0%, transparent 55%),
        radial-gradient(800px 420px at 105% 12%, rgba(52,211,153,0.08) 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background: rgba(10,10,18,0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line-soft);
      color: #fff;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--pink), #f472b6);
      display: flex; align-items: center; justify-content: center; flex: none;
      box-shadow: 0 0 16px rgba(236,92,157,0.45);
    }
    .brand-mark svg { width: 15px; height: 15px; }
    .brand-name { color: var(--ink); font-weight: 650; font-size: 0.98rem; letter-spacing: -0.01em; }
    header form { margin: 0; }
    header .btn-ghost {
      background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
      padding: 0.4rem 0.85rem; font-size: 0.82rem; font-weight: 600; border-radius: 999px;
    }
    header .btn-ghost:hover { background: var(--paper-2); color: var(--ink); }

    main { max-width: 900px; margin: 1.75rem auto 4rem; padding: 0 1.25rem; }

    h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.015em; margin: 0 0 0.2rem; color: var(--ink); }
    h2 { font-size: 1.15rem; font-weight: 650; letter-spacing: -0.01em; margin: 0; color: var(--ink); }
    h3 {
      font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--ink-soft); margin: 0 0 0.85rem;
    }
    p { line-height: 1.55; color: var(--ink); }

    /* Cards */
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 1.15rem 1.3rem;
      margin-bottom: 0.9rem;
    }
    .flash { background: rgba(96,165,250,0.10); border-color: rgba(96,165,250,0.28); color: #93c5fd; font-size: 0.88rem; }

    /* Badges */
    .badge {
      display: inline-block; padding: 0.24rem 0.7rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 650; letter-spacing: 0.01em;
    }
    .badge-unknown { background: var(--neutral-bg); color: var(--neutral-fg); }
    .badge-single { background: var(--success-bg); color: var(--success-fg); }
    .badge-multiple { background: var(--warn-bg); color: var(--warn-fg); }

    .status {
      font-size: 0.7rem; color: var(--ink-faint); text-transform: uppercase;
      letter-spacing: 0.06em; font-weight: 650;
    }

    a.job-title {
      color: var(--ink); text-decoration: none; font-weight: 650; font-size: 1.02rem;
      display: block; margin: 0.35rem 0 0.5rem;
    }
    a.job-title:hover { color: var(--pink); }

    a { color: var(--pink); }
    a.link {
      color: var(--pink); font-weight: 600; font-size: 0.86rem; text-decoration: none;
    }
    a.link:hover { text-decoration: underline; }

    /* Pill filter nav */
    .filters { margin-bottom: 0.6rem; display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; }
    .filters .filter-label {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--ink-faint); margin-right: 0.35rem;
    }
    .filters a {
      display: inline-block; padding: 0.3rem 0.75rem; border-radius: 999px;
      font-size: 0.83rem; font-weight: 600; color: var(--ink-soft); text-decoration: none;
      border: 1px solid var(--line);
    }
    .filters a:hover { background: var(--paper-2); color: var(--ink); }
    .filters a.active { background: var(--green); color: #08130e; border-color: var(--green); }

    /* Buttons */
    button, .btn {
      background: var(--green); color: #08130e; border: none; border-radius: 999px;
      padding: 0.6rem 1.15rem; cursor: pointer; font-size: 0.88rem; font-weight: 650;
      transition: opacity 120ms ease, transform 80ms ease;
    }
    button:hover, .btn:hover { opacity: 0.88; }
    button:active, .btn:active { transform: translateY(1px); }
    button:disabled { opacity: 0.4; cursor: default; }

    .job-actions { display: flex; gap: 0.4rem; }
    .icon-btn {
      background: var(--paper-2); color: var(--ink-soft); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.32rem 0.65rem; font-size: 1rem; line-height: 1;
      cursor: pointer;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.09); opacity: 1; }
    .icon-btn.is-favorite { background: var(--favorite-bg); color: var(--favorite); border-color: var(--favorite-line); }
    .icon-btn.is-favorite:hover { background: rgba(236,92,157,0.22); }

    /* Forms */
    label.form-label {
      display: block; font-weight: 650; font-size: 0.8rem; margin-bottom: 0.3rem; color: var(--ink);
    }
    .form-select, .form-textarea, .form-input {
      width: 100%; padding: 0.6rem 0.75rem; font-size: 0.9rem; font-family: inherit;
      border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-2);
      color: var(--ink); transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .form-select:focus, .form-textarea:focus, .form-input:focus {
      outline: none; border-color: var(--pink); box-shadow: 0 0 0 4px var(--accent-ring);
    }
    .form-select { color-scheme: dark; }
    textarea.form-textarea { resize: vertical; }
    .field-hint { color: var(--ink-soft); font-size: 0.82rem; margin: 0 0 0.9rem; line-height: 1.45; }
    .field { margin-bottom: 0.85rem; }

    /* Hint / meta text */
    .hint { color: var(--ink-soft); font-size: 0.82rem; }
    .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--ink-soft); }

    hr.divider { border: none; border-top: 1px solid var(--line-soft); margin: 0.9rem 0; }

    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; font-size: 0.85rem; color: var(--ink-soft); }
    .htmx-request.htmx-indicator, .htmx-request .htmx-indicator { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% url 'jobs:dashboard' %}">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14 9.5L21.5 12L14 14.5L12 22L10 14.5L2.5 12L10 9.5L12 2Z" fill="#fff"/>
        </svg>
      </span>
      <span class="brand-name">Upwork Assistant</span>
    </a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="btn-ghost">Log out</button></form>
    {% endif %}
  </header>
  <main>
    {% for message in messages %}<div class="card flash">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
